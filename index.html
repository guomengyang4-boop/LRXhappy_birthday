<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#181011">
  <meta name="description" content="一份来自 gmy 的生日祝福。">
  <title>生日快乐</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="birthday-cover scene scene--cover" aria-labelledby="birthdayTitle">
    <div class="portrait" aria-hidden="true"></div>
    <div class="portrait-glow" aria-hidden="true"></div>
    <canvas class="petals" id="petals" aria-hidden="true"></canvas>

    <div class="film-grain" aria-hidden="true"></div>
    <div class="edge-line edge-line--top" aria-hidden="true"></div>
    <div class="edge-line edge-line--bottom" aria-hidden="true"></div>

    <section class="greeting">
      <p class="greeting__eyebrow">A LITTLE MOMENT · JUST FOR YOU</p>
      <h1 id="birthdayTitle" aria-label="生日快乐">
        <span>生</span><span>日</span><span>快</span><span>乐</span>
      </h1>
      <p class="greeting__wish">愿新一岁，常有花开，常有惊喜。</p>
    </section>

    <p class="signature">来着gmy的真诚祝福</p>
    <button class="enter-wish" id="enterWish" type="button">
      <span>去许一个愿望</span><i aria-hidden="true">↓</i>
    </button>
    <button class="replay" id="replay" type="button" aria-label="重新播放开场动画">
      <span aria-hidden="true">↻</span> 再看一次
    </button>
  </main>

  <section class="wish-scene scene scene--wish" id="wishScene" aria-labelledby="wishTitle" aria-hidden="true">
    <div class="wish-scene__aurora" aria-hidden="true"></div>
    <div class="wish-scene__stars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>

    <button class="wish-back" id="wishBack" type="button" aria-label="返回生日祝福页">←</button>

    <div class="wish-copy">
      <p class="wish-copy__eyebrow">MAKE A WISH · 2026</p>
      <h2 id="wishTitle">闭上眼睛<br>许一个愿望</h2>
      <p>准备好以后，轻轻吹灭蜡烛</p>
    </div>

    <div class="cake-stage" aria-label="生日蛋糕与三支点亮的蜡烛">
      <div class="candle-row">
        <span class="candle" aria-hidden="true">
          <span class="flame"></span><span class="wick"></span><span class="candle-body"></span>
        </span>
        <span class="candle candle--tall" aria-hidden="true">
          <span class="flame"></span><span class="wick"></span><span class="candle-body"></span>
        </span>
        <span class="candle" aria-hidden="true">
          <span class="flame"></span><span class="wick"></span><span class="candle-body"></span>
        </span>
      </div>
      <div class="cake">
        <span class="cake__icing"></span>
        <span class="cake__layer cake__layer--top"></span>
        <span class="cake__layer cake__layer--bottom"></span>
        <span class="cake__plate"></span>
      </div>
    </div>

    <div class="wish-controls">
      <button class="blow-button" id="blowButton" type="button">
        <span class="blow-button__icon" aria-hidden="true"></span>
        <span>长按 3 秒 · 熄灭蜡烛</span>
      </button>
      <p id="blowStatus">按住按钮，直到光圈走完</p>
    </div>

    <div class="wish-complete" id="wishComplete" aria-live="polite">
      <span aria-hidden="true">✦</span>
      <p>愿望已经被今晚的星光收好</p>
      <small>愿它在新的一岁里，悄悄实现。</small>
    </div>
  </section>

  <script src="./script.js"></script>
</body>
</html>
